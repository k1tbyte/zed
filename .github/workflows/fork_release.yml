# Unsigned builds of this fork for macOS (Apple silicon) and Windows (x64), made with the
# scripts upstream uses (they skip signing and Sentry when the secrets are missing).
#
# Push a tag named `fork-v*` to build both and attach them to a GitHub release, or run the
# workflow by hand once this file is on the default branch to get the files as artifacts.
name: fork_release

on:
  push:
    tags:
      - fork-v*
  workflow_dispatch:
    inputs:
      macos:
        description: Build for macOS
        type: boolean
        default: true
      windows:
        description: Build for Windows
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Optimization settings are upstream's (thin LTO). Only the debug info is trimmed, which
  # keeps the thin LTO link within a free runner's memory and disk and does not change speed.
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only

jobs:
  bundle_mac:
    if: github.event_name == 'push' || inputs.macos
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain and disk space
        run: |
          sw_vers
          xcodebuild -version
          df -h /
      # Dependencies and the tools the script installs; only the default branch's cache reaches tag runs,
      # so tags just restore it and a manual run on mine refreshes it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fork-macos
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/mine' }}
      # SSH hosts download upstream's remote server, so ours is never used.
      - name: Bundle
        env:
          ZED_SKIP_REMOTE_SERVER: true
        run: ./script/bundle-mac aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: Zed-aarch64.dmg
          path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg
          if-no-files-found: error

  bundle_windows:
    if: github.event_name == 'push' || inputs.windows
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      ZED_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      # The workspace is on the small D: drive, a release build does not fit there.
      - name: Put target on the C drive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path C:\zed-target -Force | Out-Null
          cmd /c mklink /J target C:\zed-target
      # The script looks for Visual Studio Community, the runner image has Enterprise.
      - name: Point the script at Visual Studio
        shell: pwsh
        run: |
          $vs = "C:\Program Files\Microsoft Visual Studio\2022"
          if (-not (Test-Path "$vs\Community")) { cmd /c mklink /J "$vs\Community" "$vs\Enterprise" }
      - name: Set release version
        shell: pwsh
        run: |
          $version = (Select-String -Path crates/zed/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      # tar stores the target junction as an empty link, so the real directory is cached instead.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fork-windows-target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/mine' }}
          cache-targets: false
          cache-directories: C:/zed-target
      - name: Bundle
        shell: pwsh
        run: script/bundle-windows.ps1 -Architecture x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: Zed-x86_64.exe
          path: target/Zed-x86_64.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [bundle_mac, bundle_windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bundles/*/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Unsigned fork build. On macOS run \`xattr -cr /Applications/Zed.app\` after installing."
